[project]
name = "endurain-hass"
version = "0.1.0"
description = "Home Assistant integration for self-hosted Endurain instances"
license = "MIT"
requires-python = ">=3.14"

[dependency-groups]
test = [
  "pytest-homeassistant-custom-component==0.13.372",
]
lint = [
  "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]  # HA entities use mutable _attr_* class defaults

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.endurain"]
combine-as-imports = true
